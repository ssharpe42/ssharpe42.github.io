{%- comment -%}
  Figure with optional caption and link.
  Params: img (required), alt, caption, title (tooltip on the link), url, width, height
{%- endcomment -%}
{%- capture img_alt -%}{{ include.alt | default: include.caption | default: include.title | strip_html | strip }}{%- endcapture -%}
<figure>
  {%- if include.url %}<a href="{{ include.url }}"{% if include.title %} title="{{ include.title | escape }}"{% endif %}>{% endif %}
  <img src="{{ include.img | relative_url }}" alt="{{ img_alt | escape }}"{% if include.width %} width="{{ include.width }}"{% endif %}{% if include.height %} height="{{ include.height }}"{% endif %} loading="lazy">
  {%- if include.url %}</a>{% endif %}
  {%- if include.caption %}
  <figcaption>{{ include.caption }}</figcaption>
  {%- endif %}
</figure>
