---
layout: base
---
<div class="page-head">
  <div class="wrap">
    <h1>{{ page.title }}</h1>
    {%- if page.subtitle %}
    <p class="dek">{{ page.subtitle }}</p>
    {%- endif %}
  </div>
</div>

{%- if page.wide %}
<div class="page-body wrap">
  {{ content }}
</div>
{%- else %}
<div class="page-body wrap">
  <div class="prose">
    {{ content }}
  </div>
</div>
{%- endif %}
