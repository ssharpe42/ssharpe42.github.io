# sharpestats — site configuration

# --- Site --- #
title: sharpestats
description: A blog about nothing (and baseball)
author: Sam Sharpe
email: ssharpe42y@gmail.com
url: "https://sharpestats.com"
github-username: ssharpe42
scholar-url: "https://scholar.google.com/citations?user=MEnWdboAAAAJ&hl=en"

# Current role (used on the About page)
role: "Staff Engineer, Applied AI Research at Capital One"

# Homepage intro (Markdown). Shown under "A blog about nothing (and baseball)."
intro: >-
  I'm **Sam Sharpe**, a Staff Engineer in Applied AI Research at Capital One,
  building foundation models for customer behavior. Before that I built metrics
  for Statcast at MLB. Here I write long-form analyses of baseball and the
  occasional question about nothing in particular.

# Photo used on the About page and as the fallback social image
avatar: "/assets/img/prof.jpg"

# --- Navigation (top bar) --- #
# hide-sm: hidden on narrow phones to keep the bar on one line
nav-links:
  - title: Writing
    url: /writing/
  - title: Research
    url: /research/
  - title: About
    url: /aboutme/

# --- Footer links (email is added from `email` above) --- #
social-links:
  - title: GitHub
    url: "https://github.com/ssharpe42"
  - title: LinkedIn
    url: "https://www.linkedin.com/in/samuelsharpe/"
  - title: Scholar
    url: "https://scholar.google.com/citations?user=MEnWdboAAAAJ&hl=en"
  - title: RSS
    url: /feed.xml

# --- Post categories (front matter `categories`) and their display names --- #
category-labels:
  baseball: Baseball
  nothing: About nothing

# RSS description
rss-description: A blog about nothing (and baseball) by Sam Sharpe.

# Excerpt settings (used for descriptions and RSS)
excerpt_length: 50
excerpt_separator: <!--more-->

# The keywords to associate with your website, for SEO purposes
keywords: "baseball,mlb,stats,machine learning,ml,sharpe,"

# --- Web Analytics --- #
# Google Analytics gtag.js ID
gtag: "G-W9SQK72MBY"

# --- Build --- #
timezone: "America/Toronto"
markdown: kramdown
highlighter: rouge
permalink: /:year-:month-:day-:title/

kramdown:
  input: GFM

# Default front matter
defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
      social-share: true
  - scope:
      path: ""
    values:
      layout: "page"

# Exclude these files from production site
exclude:
  - CHANGELOG.md
  - CNAME
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - README.md
  - screenshot.png
  - docs/
  - vendor/
  - .idea/

plugins:
  - jekyll-sitemap
